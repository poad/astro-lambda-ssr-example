packages:
  - ./app
  - ./cdk

allowBuilds:
  esbuild: false
  sharp: false

minimumReleaseAge: 10080 # 7 days in minutes

minimumReleaseAgeExclude:
  - pnpm@12.20.0
  - '@astrojs/node@11.1.12'
  - '@astrojs/internal-helpers@0.13.2'

overrides:
  '@astrojs/node@<=11.1.11': ^11.1.12
  minimatch@>=7.0.0 <11.0.1: ^11.0.1
  semver: '>=7'

trustPolicy: no-downgrade
